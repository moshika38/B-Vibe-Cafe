name: bvibe
description: "POS System"

publish_to: "none"

version: 1.1.0+6

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  go_router: ^17.1.0
  material_symbols_icons: ^4.2906.0
  window_manager: ^0.5.1
  flutter_pos_printer_platform_image_3: ^1.3.0
  image_picker: ^1.2.1
  package_info_plus: ^9.0.0
  esc_pos_utils_plus: ^2.0.4
  intl: ^0.20.2
  sqflite: ^2.4.2
  top_snackbar_flutter: ^3.3.0
  audioplayers: ^6.6.0
  sqflite_common_ffi: ^2.4.0+2
  provider: ^6.1.5+1
  path_provider: ^2.1.5
  path: ^1.9.1
  fl_chart: ^0.70.2
  excel: ^4.0.6
  open_file_plus: ^3.4.1+1
  file_picker: ^8.1.3
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: false
  ios: false
  image_path: "assets/img/icon.png"
  web:
    generate: false
    image_path: "assets/img/icon.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: "assets/img/icon.png"
    icon_size: 256
  macos:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/img/
    - assets/items/
    - assets/sound/
    - assets/cate/
