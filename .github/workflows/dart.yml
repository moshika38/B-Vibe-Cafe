name: Flutter Windows Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # Windows apps MUST be built on a Windows runner
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Using 3.24.0 ensures Dart SDK is high enough to satisfy ^3.10.4
          flutter-version: '3.24.0'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      # Optional: Add this if you have generated code (like Freezed or Hive)
      # - name: Build Runner
      #   run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: B-Vibe-Cafe-Windows
          # Path to the release folder containing the .exe and DLLs
          path: build/windows/x64/runner/Release/
