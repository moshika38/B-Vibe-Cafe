name: Flutter Windows Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      # Force create missing asset directories to prevent build crash
      - name: Create missing asset directories
        run: |
          if (!(Test-Path "assets/svg/")) { New-Item -ItemType Directory -Path "assets/svg/" }
          if (!(Test-Path "assets/img/")) { New-Item -ItemType Directory -Path "assets/img/" }
          # Add a dummy file because Flutter hates empty asset folders
          Set-Content -Path "assets/svg/.gitkeep" -Value ""

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Upload POS Executable
        uses: actions/upload-artifact@v4
        with:
          name: bvibe-pos-windows
          path: build/windows/x64/runner/Release/
