<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#E8622A",
                        "background-light": "#f8f6f6",
                        "neutral-dark": "#2D2D2D",
                        "neutral-muted": "#886e63",
                    },
                    fontFamily: {
                        "display": ["DM Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "xl": "16px",
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        body { font-family: 'DM Sans', sans-serif; }
        .glass-blur { backdrop-filter: blur(12px); }
    </style>
</head>
<body class="bg-background-light dark:bg-[#1A1A1A] font-display text-neutral-dark dark:text-slate-100 min-h-screen flex items-center justify-center p-6 overflow-hidden">
<div class="fixed inset-0 z-0 flex flex-col p-8 opacity-30 grayscale-[0.2] blur-xl pointer-events-none">
<header class="flex justify-between items-center mb-8">
<div class="h-10 w-40 bg-slate-300 rounded-lg"></div>
<div class="flex gap-4">
<div class="h-10 w-10 bg-slate-300 rounded-full"></div>
<div class="h-10 w-32 bg-slate-300 rounded-lg"></div>
</div>
</header>
<div class="grid grid-cols-12 gap-6 grow">
<div class="col-span-8 grid grid-cols-3 gap-4 content-start">
<div class="h-32 bg-slate-200 rounded-xl"></div>
<div class="h-32 bg-slate-200 rounded-xl"></div>
<div class="h-32 bg-slate-200 rounded-xl"></div>
<div class="h-32 bg-slate-200 rounded-xl"></div>
<div class="h-32 bg-slate-200 rounded-xl"></div>
<div class="h-32 bg-slate-200 rounded-xl"></div>
</div>
<div class="col-span-4 bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col p-4">
<div class="h-6 w-1/2 bg-slate-200 mb-4 rounded"></div>
<div class="space-y-3">
<div class="h-4 bg-slate-100 rounded w-full"></div>
<div class="h-4 bg-slate-100 rounded w-full"></div>
<div class="h-4 bg-slate-100 rounded w-3/4"></div>
</div>
</div>
</div>
</div>
<div class="fixed inset-0 bg-black/10 glass-blur z-10 flex items-center justify-center p-4">
<div class="flex flex-col max-w-[440px] w-full bg-white dark:bg-zinc-900 rounded-xl shadow-[0_20px_50px_rgba(0,0,0,0.15)] overflow-hidden border border-white/40 dark:border-zinc-800">
<div class="flex flex-col items-center text-center px-10 pt-10 pb-6">
<div class="flex items-center justify-center size-12 rounded-full bg-primary/10 text-primary mb-5">
<span class="material-symbols-outlined text-[28px]">lock</span>
</div>
<h1 class="text-neutral-dark dark:text-slate-100 text-2xl font-bold tracking-tight mb-2">Manager Authorization Required</h1>
<p class="text-neutral-muted dark:text-zinc-400 text-base font-normal leading-relaxed">
                This action <span class="font-semibold text-primary">(Void Item)</span> requires elevated permissions. Please enter a manager PIN.
            </p>
</div>
<div class="flex flex-col items-center px-10 pb-8">
<fieldset class="flex gap-4">
<input class="flex h-16 w-14 text-center [appearance:textfield] focus:outline-0 focus:ring-2 focus:ring-primary/20 rounded-xl border-none bg-[#F5F5F7] dark:bg-zinc-800 focus:bg-white dark:focus:bg-zinc-700 text-2xl font-bold text-slate-900 dark:text-white transition-all shadow-inner" maxlength="1" type="password" value=""/>
<input class="flex h-16 w-14 text-center [appearance:textfield] focus:outline-0 focus:ring-2 focus:ring-primary/20 rounded-xl border-none bg-[#F5F5F7] dark:bg-zinc-800 focus:bg-white dark:focus:bg-zinc-700 text-2xl font-bold text-slate-900 dark:text-white transition-all shadow-inner" maxlength="1" type="password" value=""/>
<input class="flex h-16 w-14 text-center [appearance:textfield] focus:outline-0 focus:ring-2 focus:ring-primary/20 rounded-xl border-none bg-[#F5F5F7] dark:bg-zinc-800 focus:bg-white dark:focus:bg-zinc-700 text-2xl font-bold text-slate-900 dark:text-white transition-all shadow-inner" maxlength="1" type="password" value=""/>
<input class="flex h-16 w-14 text-center [appearance:textfield] focus:outline-0 focus:ring-2 focus:ring-primary/20 rounded-xl border-none bg-[#F5F5F7] dark:bg-zinc-800 focus:bg-white dark:focus:bg-zinc-700 text-2xl font-bold text-slate-900 dark:text-white transition-all shadow-inner" maxlength="1" type="password" value=""/>
</fieldset>
<a class="mt-6 text-sm font-semibold text-primary hover:text-primary/80 transition-colors" href="#">
                Forgot PIN?
            </a>
</div>
<div class="px-10 pb-10 flex flex-col gap-3">
<button class="w-full bg-primary hover:bg-primary/90 text-white h-14 rounded-xl font-bold text-lg shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-xl">verified_user</span>
                Authorize
            </button>
<button class="w-full bg-slate-100 dark:bg-zinc-800 hover:bg-slate-200 dark:hover:bg-zinc-700 text-slate-600 dark:text-zinc-300 h-14 rounded-xl font-bold transition-all">
                Cancel Action
            </button>
</div>
<div class="bg-slate-50 dark:bg-zinc-800/50 py-4 px-10 text-center border-t border-slate-100 dark:border-zinc-800">
<p class="text-xs text-neutral-muted dark:text-zinc-500 font-medium italic">
                You can also tap your manager NFC keycard for instant authorization.
            </p>
</div>
</div>
</div>

</body></html>
