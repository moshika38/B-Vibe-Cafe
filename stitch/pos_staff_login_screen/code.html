<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>POS Staff Login Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#E8622A",
                        "background-light": "#FAFAF8",
                        "background-dark": "#1A1A1A",
                        "neutral-soft": "#F5F5F7",
                        "text-dark": "#2D2D2D",
                        "text-muted": "#886e63"
                    },
                    fontFamily: {
                        "display": ["DM Sans", "sans-serif"],
                        "sans": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        body {
            font-family: 'DM Sans', sans-serif;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-[#FAFAF8] dark:bg-background-dark h-screen w-screen flex items-center justify-center m-0 p-0">
<div class="max-w-[1000px] w-[90%] md:w-full bg-white dark:bg-slate-900 rounded-xl shadow-[0_20px_50px_rgba(0,0,0,0.1)] overflow-hidden flex flex-col md:flex-row min-h-[600px] max-h-[90vh]">
<div class="relative w-full md:w-1/2 hidden md:block">
<div class="absolute inset-0 bg-[#E8622A]/20 mix-blend-multiply z-10"></div>
<div class="absolute inset-0 bg-gradient-to-t from-[#E8622A]/40 to-transparent z-10"></div>
<img alt="Modern cafe interior" class="absolute inset-0 w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDwLZx1jpDwg7XtD6cEtYknbS0bEQBMe4qGop1zsJdzVjdo9v_yGhthmil4BSNbqPuo-Rm8R38sUECqvhh_xFKAxc8CrhAw-U9TBX5NPftZeS4URenOxBQCTAwQuVqY6TdHRaDg7mjLnzz5E3pQAhSdy6FVO2ny5IBAADvKTu9gMDc5KqamvQuyQ0L7iBu-8zWaoSZVH5uRc-uvuD5yOfQyr7O_u0uqjQGSSfAZy5PqJQrYxlTP-v4xHAOhAPhVjxHj2vqSmJCcgYo4"/>
<div class="relative z-20 h-full flex flex-col justify-end p-12 text-white">
<div class="flex items-center gap-2 mb-4">
<span class="material-symbols-outlined text-4xl">restaurant</span>
<h1 class="text-2xl font-bold tracking-tight">Lumina POS</h1>
</div>
<p class="text-lg opacity-90 font-medium">Elevating the dining experience through seamless service.</p>
</div>
</div>
<div class="w-full md:w-1/2 p-8 md:p-16 flex flex-col justify-center bg-white dark:bg-slate-900">
<div class="mb-10 text-center md:text-left">
<div class="inline-flex items-center justify-center size-14 rounded-xl bg-primary/10 text-primary mb-6 md:hidden">
<span class="material-symbols-outlined text-3xl">restaurant</span>
</div>
<div class="hidden md:flex items-center gap-2 mb-8 text-primary">
<span class="material-symbols-outlined text-3xl">restaurant</span>
<span class="text-xl font-bold tracking-tight">Lumina</span>
</div>
<h2 class="text-3xl font-bold text-text-dark dark:text-slate-100 mb-2">Welcome back</h2>
<p class="text-text-muted dark:text-slate-400">Sign in to your station to begin your shift</p>
</div>
<form class="space-y-6" onsubmit="return false;">
<div class="space-y-2">
<label class="text-sm font-semibold text-text-dark dark:text-slate-200 ml-1" for="staff-id">Staff ID</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-text-muted">badge</span>
<input class="w-full pl-12 pr-4 py-4 bg-[#F5F5F7] dark:bg-slate-800 border-none rounded-lg focus:ring-2 focus:ring-primary/50 text-text-dark dark:text-slate-100 placeholder:text-text-muted/60 transition-all" id="staff-id" placeholder="Enter your ID number" type="text"/>
</div>
</div>
<div class="space-y-2">
<div class="flex justify-between items-center ml-1">
<label class="text-sm font-semibold text-text-dark dark:text-slate-200" for="pin">PIN / Password</label>
<a class="text-xs font-bold text-primary hover:underline" href="#">Forgot PIN?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-text-muted">lock</span>
<input class="w-full pl-12 pr-12 py-4 bg-[#F5F5F7] dark:bg-slate-800 border-none rounded-lg focus:ring-2 focus:ring-primary/50 text-text-dark dark:text-slate-100 placeholder:text-text-muted/60 transition-all" id="pin" placeholder="••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-text-muted hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<button class="w-full bg-[#E8622A] hover:bg-[#D5521B] text-white font-bold py-4 rounded-lg shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2 group" type="submit">
<span>Login to Station</span>
<span class="material-symbols-outlined text-xl group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<div class="mt-12 pt-8 border-t border-neutral-soft dark:border-slate-800 flex flex-col items-center gap-4">
<button class="flex items-center gap-2 text-sm font-medium text-text-muted hover:text-primary transition-colors">
<span class="material-symbols-outlined text-lg">sync_alt</span>
<span>Change Station</span>
</button>
<div class="flex items-center gap-4 mt-2">
<div class="flex items-center gap-1 text-[10px] uppercase tracking-widest text-text-muted/50 font-bold">
<span class="size-1.5 rounded-full bg-green-500"></span>
                        System Online
                    </div>
<div class="text-[10px] uppercase tracking-widest text-text-muted/50 font-bold">
                        v2.4.0-build
                    </div>
</div>
</div>
</div>
</div>

</body></html>
